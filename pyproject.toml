[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-validator"
version = "0.1.0"
description = "Validate SQL schemas and render integrity violations in Mermaid ER diagrams."
requires-python = ">=3.9"
dependencies = ["sqlglot>=27.0.0"]

[project.scripts]
sql-validator = "sql_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

